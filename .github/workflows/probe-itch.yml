# TEMPORARY probe: dump itch.io pages to the log (the dev container cannot reach itch.io).
name: probe itch
on:
  push:
    branches: [ccr-7faca805-jcixi2]
    paths: [.github/workflows/probe-itch.yml, probe_itch.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx openpyxl
      - run: python probe_itch.py
