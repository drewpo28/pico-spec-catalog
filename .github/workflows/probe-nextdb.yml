# TEMPORARY: run the nextdb adapter and print the tree (no Pages deploy).
name: probe nextdb
on:
  push:
    branches: [ccr-7faca805-jcixi2]
    paths: [.github/workflows/probe-nextdb.yml, app/adapters/nextdb.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python3 gen_static.py --out _site --site nextdb 2>&1 | tail -40
      - run: cd _site/nextdb && for f in $(ls *.tsv | sort); do echo "== $f"; cat "$f"; done | cut -c1-220
