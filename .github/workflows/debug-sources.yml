# TEMPORARY diagnostic — probes archive.org (tosec) and spectrum4ever.org (s4e)
# from a GitHub runner to explain the empty listings in the catalog build.
# Runs only on the working branch; deleted before merging.
name: Debug source fetch

on:
  push:
    branches: [claude/demos-games-archive-source-up5hva]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Probe sources
        run: |
          python3 - <<'EOF'
          import httpx, json, traceback
          from urllib.parse import quote

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          c = httpx.Client(timeout=180, follow_redirects=True, headers={"User-Agent": UA})

          def step(label, fn):
              print(f"\n===== {label} =====", flush=True)
              try:
                  fn()
              except Exception:
                  traceback.print_exc()

          j = {}
          def meta():
              global j
              r = c.get("https://archive.org/metadata/tosec-main")
              j = r.json()
              md = j.get("metadata", {})
              print("status:", r.status_code, "server:", j.get("server"),
                    "d1:", j.get("d1"), "d2:", j.get("d2"), "dir:", j.get("dir"))
              print("access-restricted-item:", md.get("access-restricted-item"),
                    "is_dark:", j.get("is_dark"), "collection:", md.get("collection"))
              zips = [f["name"] for f in j.get("files", [])
                      if f["name"].startswith("Sinclair/ZX Spectrum/Demos/[TRD]/")
                      and f["name"].endswith(".zip")]
              print("TRD demos zips:", zips)
          step("metadata", meta)

          ZP = "Sinclair/ZX Spectrum/Demos/[TRD]/Sinclair ZX Spectrum - Demos - [TRD] (TOSEC-v2025-01-15).zip"
          def find_zip():
              global ZP
              zips = [f["name"] for f in j.get("files", [])
                      if f["name"].startswith("Sinclair/ZX Spectrum/Demos/[TRD]/")
                      and f["name"].endswith(".zip")]
              if zips:
                  ZP = zips[0]
              print("using:", ZP)
          step("pick zip", find_zip)

          def zipview():
              r = c.get(f"https://archive.org/download/tosec-main/{quote(ZP)}/")
              print("status:", r.status_code, "final:", str(r.url)[:200])
              print("hdrs:", {k: v for k, v in r.headers.items()
                              if k.lower() in ("server", "content-type", "cf-ray", "x-cache")})
              print("len:", len(r.text), "body head:", r.text[:300].replace("\n", " "))
          step("zip view via frontend (follow redirects)", zipview)

          def zipview_referer():
              server, dr = j.get("server"), j.get("dir")
              va = f"https://{server}/view_archive.php?archive={quote(dr + '/' + ZP, safe='/')}"
              r = c.get(va, headers={"Referer": "https://archive.org/"})
              print("status:", r.status_code, "len:", len(r.text))
              print("hdrs:", dict(list(r.headers.items())[:8]))
              print("body head:", r.text[:300].replace("\n", " "))
          step("datanode view_archive + referer", zipview_referer)

          def ranged():
              for rng in ("bytes=0-99", "bytes=-1000"):
                  r = c.get(f"https://archive.org/download/tosec-main/{quote(ZP)}",
                            headers={"Range": rng})
                  print(rng, "->", r.status_code, "content-range:", r.headers.get("content-range"),
                        "got:", len(r.content), "final:", str(r.url)[:160])
          step("ranged zip read", ranged)

          def s4e():
              r = c.get("https://spectrum4ever.org/fulltape.php?go=releases&letter=A")
              print("status:", r.status_code, "final:", str(r.url)[:160], "len:", len(r.text))
              print("rows(release__):", r.text.count("release__"),
                    "tape.png:", r.text.count("tape.png"),
                    "download.php:", r.text.count("download.php"))
              print("hdrs:", {k: v for k, v in r.headers.items()
                              if k.lower() in ("server", "content-type", "cf-ray", "cf-mitigated")})
              print("body head:", r.text[:600].replace("\n", " "))
          step("s4e letter A", s4e)

          def s4e_plain():
              r = httpx.get("https://spectrum4ever.org/fulltape.php?go=releases&letter=A",
                            timeout=60, follow_redirects=True)
              print("no-UA status:", r.status_code, "len:", len(r.text))
          step("s4e without browser UA", s4e_plain)
          EOF
