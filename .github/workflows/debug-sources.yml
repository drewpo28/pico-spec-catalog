# TEMPORARY diagnostic — round 3: map the public TOSEC item's tree and verify
# redirect-free datanode URLs. Deleted before merging.
name: Debug source fetch

on:
  push:
    branches: [claude/demos-games-archive-source-up5hva]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Probe sources
        run: |
          python3 - <<'EOF'
          import httpx, traceback
          from collections import Counter
          from urllib.parse import quote

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          c = httpx.Client(timeout=180, follow_redirects=True, headers={"User-Agent": UA})

          def step(label, fn):
              print(f"\n===== {label} =====", flush=True)
              try:
                  fn()
              except Exception:
                  traceback.print_exc()

          IDENT = "ZXSpectrumTOSECSetV20171101LadyEklipse"
          j = {}
          def census():
              global j
              j = c.get(f"https://archive.org/metadata/{IDENT}").json()
              files = j.get("files", [])
              print("server:", j.get("server"), "dir:", j.get("dir"), "files:", len(files))
              top = Counter(f["name"].split("/")[0] for f in files)
              print("top-level:", dict(top.most_common(30)))
              for sec in ("Games", "Demos"):
                  sub = Counter(f["name"].split("/")[1] for f in files
                                if f["name"].startswith(sec + "/") and f["name"].count("/") >= 2)
                  print(f"{sec}/ second level:", dict(sub.most_common(30)))
              exts = Counter(f["name"].rsplit(".", 1)[-1].lower() for f in files)
              print("extensions:", dict(exts.most_common(10)))
              for probe in ("Games/[TAP]/", "Games/[TRD]/", "Demos/[TRD]/", "Demos/[TAP]/"):
                  names = [f["name"] for f in files if f["name"].startswith(probe)][:4]
                  print(probe, "->", names)
          step(f"census {IDENT}", census)

          def datanode():
              files = j.get("files", [])
              sample = next(f["name"] for f in files
                            if f["name"].startswith("Games/") and f["name"].endswith(".zip"))
              base = f"https://{j['server']}{j['dir']}/{quote(sample)}"
              nc = httpx.Client(timeout=60, follow_redirects=False, headers={"User-Agent": UA})
              for u in (base, base + "?fn=/test.zip"):
                  r = nc.get(u, headers={"Range": "bytes=0-99"})
                  print(r.status_code, r.headers.get("content-range"),
                        r.headers.get("location", ""), "<-", u[:160])
          step("direct datanode URL (no redirects allowed)", datanode)

          def others():
              for ident in ("zx_spectrum_tosec_set_september_2023",
                            "zx-spectrum-tosec-set-v-2020-02-18-lady-eklipse",
                            "Sinclair_ZX_Spectrum_TOSEC_2012_04_23"):
                  m = c.get(f"https://archive.org/metadata/{ident}").json()
                  names = [(f["name"], f.get("size")) for f in m.get("files", [])]
                  print(f"\n{ident}: restricted={m.get('metadata', {}).get('access-restricted-item')}")
                  for n, s in names[:25]:
                      print("   ", n, s)
          step("alternative items", others)
          EOF
