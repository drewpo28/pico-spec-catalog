# TEMPORARY diagnostic — inspect wildcard items for a fresh per-file ZX set.
# Deleted after use.
name: Debug source fetch

on:
  push:
    branches: [claude/demos-games-archive-source-up5hva]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Inspect wildcard items
        run: |
          python3 - <<'EOF'
          import httpx, traceback
          from collections import Counter

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          c = httpx.Client(timeout=300, follow_redirects=True, headers={"User-Agent": UA})

          def inspect(ident):
              print(f"\n===== {ident} =====", flush=True)
              try:
                  j = c.get(f"https://archive.org/metadata/{ident}").json()
                  md = j.get("metadata", {})
                  files = j.get("files", [])
                  print("restricted:", md.get("access-restricted-item"),
                        "files:", len(files), "item_size:", j.get("item_size"),
                        "title:", (md.get("title") or "")[:100])
                  top = Counter(f["name"].split("/")[0] for f in files)
                  print("top-level (15):", dict(top.most_common(15)))
                  exts = Counter(f["name"].rsplit(".", 1)[-1].lower() for f in files)
                  print("extensions (10):", dict(exts.most_common(10)))
                  zx = [f["name"] for f in files
                        if any(k in f["name"].lower() for k in ("spectrum", "sinclair", "zx"))]
                  print("zx-ish paths:", len(zx))
                  for n in zx[:10]:
                      print("   ", n[:170])
              except Exception:
                  traceback.print_exc()

          for ident in ("hearto-1g1r-collection", "the-spectrum_202412",
                        "games_20260723_1453", "tosec"):
              inspect(ident)
          EOF
