# TEMPORARY diagnostic — is TOSEC_S_to_Z-13.08.2023 (or any other public item)
# a per-title-zip mirror of the 2023 ZX Spectrum TOSEC set? Deleted after use.
name: Debug source fetch

on:
  push:
    branches: [claude/demos-games-archive-source-up5hva]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Probe 2023 candidates
        run: |
          python3 - <<'EOF'
          import httpx, re, traceback
          from collections import Counter
          from urllib.parse import quote

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          c = httpx.Client(timeout=300, follow_redirects=True, headers={"User-Agent": UA})

          def step(label, fn):
              print(f"\n===== {label} =====", flush=True)
              try:
                  fn()
              except Exception:
                  traceback.print_exc()

          def inspect(ident):
              j = c.get(f"https://archive.org/metadata/{ident}").json()
              md = j.get("metadata", {})
              files = j.get("files", [])
              print(f"{ident}: restricted={md.get('access-restricted-item')} "
                    f"files={len(files)} server={j.get('server')} dir={j.get('dir')}")
              top = Counter(f["name"].split("/")[0] for f in files)
              print("  top-level (20):", dict(top.most_common(20)))
              zx = [f for f in files if "ZX Spectrum" in f["name"]]
              print("  paths containing 'ZX Spectrum':", len(zx))
              for f in zx[:8]:
                  print("   ", f["name"][:160], f.get("size"))
              return j

          def s_to_z():
              j = inspect("TOSEC_S_to_Z-13.08.2023")
              files = j.get("files", [])
              # census one more level under the Sinclair subtree, if present
              sub = Counter("/".join(f["name"].split("/")[:2]) for f in files
                            if f["name"].startswith("Sinclair"))
              for k, v in sub.most_common(25):
                  print("  ", k, v)
              gz = [f for f in files if "/Games/" in f["name"] or "- Games -" in f["name"]]
              print("  games-ish files:", len(gz))
              for f in gz[:6]:
                  print("   ", f["name"][:170], f.get("size"))
          step("TOSEC_S_to_Z-13.08.2023", s_to_z)

          def wider_search():
              seen = set()
              for q in ('sinclair AND tosec', 'title:("zx spectrum") AND tosec',
                        '"tosec" AND "zx"'):
                  r = c.get("https://archive.org/advancedsearch.php",
                            params={"q": q, "fl[]": "identifier", "rows": "100",
                                    "output": "json"})
                  for d in r.json().get("response", {}).get("docs", []):
                      seen.add(d["identifier"])
              print(len(seen), "identifiers:")
              print(sorted(seen))
          step("wider search", wider_search)
          EOF
