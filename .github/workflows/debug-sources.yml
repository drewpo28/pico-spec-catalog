# TEMPORARY diagnostic — what does tosecdev.org/downloads actually serve?
# Deleted after the probe.
name: Debug source fetch

on:
  push:
    branches: [claude/demos-games-archive-source-up5hva]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Probe tosecdev.org
        run: |
          python3 - <<'EOF'
          import httpx, re, traceback

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": UA})

          def step(label, fn):
              print(f"\n===== {label} =====", flush=True)
              try:
                  fn()
              except Exception:
                  traceback.print_exc()

          def clean(s):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s)).strip()

          links = []
          def downloads():
              r = c.get("https://www.tosecdev.org/downloads")
              print("status:", r.status_code, "len:", len(r.text))
              for href, txt in re.findall(r'<a\s[^>]*href="([^"]+)"[^>]*>(.*?)</a>',
                                          r.text, re.S | re.I):
                  t = clean(txt)
                  if "download" in href.lower() and t and len(t) < 90:
                      links.append((href, t))
              seen = set()
              for h, t in links:
                  if h in seen: continue
                  seen.add(h)
                  print(f"  {t!r:60} -> {h[:120]}")
          step("downloads index", downloads)

          def category():
              cats = [h for h, t in links
                      if "/downloads/" in h and "category" in h.lower()] or \
                     [h for h, t in links if "/downloads/" in h]
              if not cats:
                  print("no category links found"); return
              url = cats[0]
              if url.startswith("/"):
                  url = "https://www.tosecdev.org" + url
              r = c.get(url)
              print("category:", url[:120], "status:", r.status_code)
              for href, txt in re.findall(r'<a\s[^>]*href="([^"]+)"[^>]*>(.*?)</a>',
                                          r.text, re.S | re.I)[:400]:
                  t = clean(txt)
                  if t and ("download" in href.lower() or ".zip" in href.lower()):
                      print(f"  {t!r:70} -> {href[:130]}")
              # any mention of file sizes / descriptions
              for m in re.findall(r"(?:Size|Filesize)[^<]{0,40}", r.text)[:10]:
                  print("  size hint:", clean(m))
          step("first category page", category)
          EOF
